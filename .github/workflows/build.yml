name: Maven Build

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CONFIG_PROPERTIES: ./src/test/resources/config.properties
  CONFIG_PROPERTIES_SAMPLE: ./src/test/resources/config.properties.sample

jobs:
  build:

    runs-on: ubuntu-latest

    environment: OSSBUILD

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Set Test Secrets
      if: contains(env.IBMI_HOST, '.')
      run: |
        cp ${{ env.CONFIG_PROPERTIES_SAMPLE }} ${{ env.CONFIG_PROPERTIES }}
        sed -i "s/^IBMI_HOST=/IBMI_HOST=$IBMI_HOST/" ${{ env.CONFIG_PROPERTIES }}
        sed -i "s/^IBMI_USER=/IBMI_USER=$IBMI_USER/" ${{ env.CONFIG_PROPERTIES }}
        sed -i "s/^IBMI_PASSWORD=/IBMI_PASSWORD=$IBMI_PASSWORD/" ${{ env.CONFIG_PROPERTIES }}
        sed -i "s/^IBMI_PORT=/IBMI_PORT=$IBMI_PORT/" ${{ env.CONFIG_PROPERTIES }}
      env:
        IBMI_HOST: ${{ secrets.IBMI_HOST }}
        IBMI_USER: ${{ secrets.IBMI_USER }}
        IBMI_PASSWORD: ${{ secrets.IBMI_PASSWORD }}
        IBMI_PORT: ${{ secrets.IBMI_PORT }}

    - name: Build with Maven
      env:
        IBMI_HOST: ${{ secrets.IBMI_HOST }}
      run: |
        if [[ "$IBMI_HOST" == *.* ]]; then
          mvn --batch-mode clean package --file pom.xml
        else
          mvn --batch-mode clean package --file pom.xml -DskipTests
        fi

    - name: Update Dependency Graph
      if: github.ref == 'refs/heads/main'
      uses: advanced-security/maven-dependency-submission-action@v4
