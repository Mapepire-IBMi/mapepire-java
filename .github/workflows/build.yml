name: Maven Build

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CONFIG_PROPERTIES: ./src/test/resources/config.properties
  CONFIG_PROPERTIES_SAMPLE: ./src/test/resources/config.properties.sample

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up JDK 8
      uses: actions/setup-java@v6
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn --batch-mode clean package --file pom.xml

    - name: Update Dependency Graph
      if: github.ref == 'refs/heads/main'
      uses: advanced-security/maven-dependency-submission-action@v6

  integration:
    runs-on: ubuntu-latest
    environment: OSSBUILD
    needs: build

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up JDK 8
      uses: actions/setup-java@v6
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Determine whether to run integration tests
      id: should_run
      env:
        IBMI_HOST: ${{ secrets.IBMI_HOST }}
        IBMI_PORT: ${{ secrets.IBMI_PORT }}
      run: |
        skip() {
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "$1"
          {
            echo "## Integration tests"
            echo "Skipped: $1"
          } >> "$GITHUB_STEP_SUMMARY"
        }

        if [[ -z "$IBMI_HOST" || -z "$IBMI_PORT" ]]; then
          skip "IBM i secrets were not available in this environment."
          exit 0
        fi

        # Require the Mapepire host to accept TCP before running the suite so a
        # down / unreachable machine skips instead of failing the job.
        if ! nc -z -w 10 "$IBMI_HOST" "$IBMI_PORT" 2>/dev/null; then
          skip "IBM i machine ${IBMI_HOST}:${IBMI_PORT} was not reachable."
          exit 0
        fi

        echo "run=true" >> "$GITHUB_OUTPUT"
        echo "IBM i secrets available and ${IBMI_HOST}:${IBMI_PORT} reachable; running integration tests."

    - name: Set Test Secrets
      if: steps.should_run.outputs.run == 'true'
      run: |
        cp ${{ env.CONFIG_PROPERTIES_SAMPLE }} ${{ env.CONFIG_PROPERTIES }}
        sed -i "s/^IBMI_HOST=/IBMI_HOST=$IBMI_HOST/" ${{ env.CONFIG_PROPERTIES }}
        sed -i "s/^IBMI_USER=/IBMI_USER=$IBMI_USER/" ${{ env.CONFIG_PROPERTIES }}
        sed -i "s/^IBMI_PASSWORD=/IBMI_PASSWORD=$IBMI_PASSWORD/" ${{ env.CONFIG_PROPERTIES }}
        sed -i "s/^IBMI_PORT=/IBMI_PORT=$IBMI_PORT/" ${{ env.CONFIG_PROPERTIES }}
      env:
        IBMI_HOST: ${{ secrets.IBMI_HOST }}
        IBMI_USER: ${{ secrets.IBMI_USER }}
        IBMI_PASSWORD: ${{ secrets.IBMI_PASSWORD }}
        IBMI_PORT: ${{ secrets.IBMI_PORT }}

    - name: Run integration tests
      if: steps.should_run.outputs.run == 'true'
      run: |
        mvn --batch-mode test -Pintegration --file pom.xml
        {
          echo "## Integration tests"
          echo "Ran: IBM i integration suite via \`-Pintegration\`."
        } >> "$GITHUB_STEP_SUMMARY"
